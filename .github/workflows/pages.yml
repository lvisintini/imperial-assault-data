name: Pages

# Deploys the data explorer: site/ at the root of the published site, with data/, images/ and docs/ next to it
# (serve_site.py serves the same layout locally).
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "data/**"
      - "images/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        run: |
          mv site _site
          mv data images docs _site/
          # The explorer reads maps and map tiles from images/small (site/js/views.js); their large images (128 px
          # per square, twice the small ones) would take the site over Pages' 1 GB.
          rm -r _site/images/large/maps _site/images/large/map-tiles
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The site is about 700 MB in some 5,000 files (2.0.0's maps and tiles): GitHub's sync of it can take longer
          # than the default 10 minutes.
          timeout: 1800000
